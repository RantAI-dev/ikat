<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260"
     role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Serving: candidates in, one figure out</title>
  <desc id="d">Per query: hybrid retrieval returns chunks; every figure whose anchor chunk
    was retrieved is admitted as a candidate by a join rather than a caption test; a
    cross-encoder keeps the top two; a vision-language model judges each survivor as an
    image and may only remove; the highest remaining score is emitted, and emitting
    nothing is a valid outcome.</desc>

  <style>
    .fg   { fill: #16130f; }
    .mut  { fill: #6c6459; }
    .card { fill: #ffffff; stroke: #e2ddd4; }
    .band { fill: #f3f0ea; stroke: #e2ddd4; }
    .acc  { fill: #e4572e; }
    .accs { stroke: #e4572e; }
    .accf { fill: #e4572e; fill-opacity: .10; stroke: #e4572e; }
    @media (prefers-color-scheme: dark) {
      .fg   { fill: #ece7df; }
      .mut  { fill: #9a9188; }
      .card { fill: #1b1815; stroke: #2e2a25; }
      .band { fill: #201d19; stroke: #2e2a25; }
      .acc  { fill: #ff6b41; }
      .accs { stroke: #ff6b41; }
      .accf { fill: #ff6b41; fill-opacity: .13; stroke: #ff6b41; }
    }
    .lbl  { font-size: 10px; letter-spacing: .11em; text-transform: uppercase; }
    .ttl  { font-size: 13px; font-weight: 600; }
    .sm   { font-size: 10.5px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .big  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }
  </style>

  <defs>
    <marker id="s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="mut"/>
    </marker>
  </defs>

  <text x="14" y="22" class="lbl mut">Per query</text>

  <!-- query -->
  <rect x="14" y="34" width="118" height="58" rx="6" class="band"/>
  <text x="73" y="58" class="ttl fg" text-anchor="middle">query</text>
  <text x="73" y="76" class="sm mut" text-anchor="middle">one question</text>

  <path d="M136 63 L164 63" class="mut" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#s)"/>

  <!-- retrieve -->
  <rect x="168" y="34" width="150" height="58" rx="6" class="card"/>
  <text x="182" y="55" class="ttl fg">5 · Retrieve</text>
  <text x="182" y="74" class="sm mut">hybrid, top-k chunks</text>

  <path d="M322 63 L350 63" class="mut" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#s)"/>

  <!-- admit -->
  <rect x="354" y="34" width="196" height="58" rx="6" class="card accs" stroke-width="1.5"/>
  <text x="368" y="55" class="ttl acc">6 · Admit</text>
  <text x="368" y="74" class="sm mut">join on the anchor — no caption test</text>

  <path d="M554 63 L582 63" class="mut" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#s)"/>

  <rect x="586" y="34" width="300" height="58" rx="6" class="accf"/>
  <text x="600" y="55" class="ttl fg">every uncaptioned figure is reachable here</text>
  <text x="600" y="74" class="sm mut">and by no other route in the pipeline</text>

  <!-- funnel row -->
  <text x="14" y="132" class="lbl mut">Then narrow</text>

  <rect x="14" y="146" width="196" height="88" rx="6" class="card"/>
  <text x="30" y="168" class="ttl fg">candidates</text>
  <text x="30" y="196" class="big acc">≈ 6</text>
  <text x="30" y="222" class="sm mut">figures admitted per question</text>

  <path d="M214 190 L242 190" class="mut" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#s)"/>

  <rect x="246" y="146" width="196" height="88" rx="6" class="card"/>
  <text x="262" y="168" class="ttl fg">7 · Prefilter</text>
  <text x="262" y="196" class="big acc">2</text>
  <text x="262" y="222" class="sm mut">cross-encoder keeps the top two</text>

  <path d="M446 190 L474 190" class="mut" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#s)"/>

  <rect x="478" y="146" width="196" height="88" rx="6" class="card"/>
  <text x="494" y="168" class="ttl fg">8 · Gate</text>
  <text x="494" y="196" class="big acc">≤ 2</text>
  <text x="494" y="222" class="sm mut">a VLM sees the image; may only remove</text>

  <path d="M678 190 L706 190" class="mut" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#s)"/>

  <rect x="710" y="146" width="176" height="88" rx="6" class="card accs" stroke-width="1.5"/>
  <text x="726" y="168" class="ttl acc">9 · Emit</text>
  <text x="726" y="196" class="big acc">1 or 0</text>
  <text x="726" y="222" class="sm mut">nothing is a valid answer</text>
</svg>
