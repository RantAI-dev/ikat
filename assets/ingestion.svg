<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430"
     role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Where the reading order is lost</title>
  <desc id="d">A layout parser emits an ordered block sequence in which a figure sits
    between two paragraphs. Conventional ingestion stores prose as chunks and figures
    as a separate array, discarding the ordering, so position must afterwards be
    reconstructed from the caption. Anchor-preserving ingestion records the index of
    the chunk holding the preceding prose block, so position becomes a lookup.</desc>

  <style>
    .fg   { fill: #16130f; }
    .mut  { fill: #6c6459; }
    .rule { stroke: #d8d2c8; }
    .card { fill: #ffffff; stroke: #e2ddd4; }
    .page { fill: #f3f0ea; stroke: #e2ddd4; }
    .acc  { fill: #e4572e; }
    .accs { stroke: #e4572e; }
    .dead { stroke: #b1442a; }
    .deadf{ fill: #b1442a; }
    @media (prefers-color-scheme: dark) {
      .fg   { fill: #ece7df; }
      .mut  { fill: #9a9188; }
      .rule { stroke: #34302a; }
      .card { fill: #1b1815; stroke: #2e2a25; }
      .page { fill: #201d19; stroke: #2e2a25; }
      .acc  { fill: #ff6b41; }
      .accs { stroke: #ff6b41; }
      .dead { stroke: #e07a5f; }
      .deadf{ fill: #e07a5f; }
    }
    .lbl  { font-size: 10px; letter-spacing: .11em; text-transform: uppercase; }
    .txt  { font-size: 12.5px; }
    .sm   { font-size: 11px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="mut"/>
    </marker>
    <marker id="aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="acc"/>
    </marker>
  </defs>

  <!-- ── Source: what every layout parser already emits ─────────────────── -->
  <text x="14" y="24" class="lbl mut">Parser output</text>
  <rect x="14" y="34" width="168" height="238" rx="8" class="page"/>

  <rect x="28" y="50"  width="140" height="24" rx="4" class="card"/>
  <text x="40" y="66"  class="txt mut">heading</text>

  <rect x="28" y="82"  width="140" height="24" rx="4" class="card"/>
  <text x="40" y="98"  class="txt fg">paragraph</text>
  <text x="150" y="98" class="mono mut" text-anchor="end">b₁</text>

  <rect x="28" y="114" width="140" height="38" rx="4" class="card accs" stroke-width="1.5"/>
  <rect x="36" y="122" width="26" height="22" rx="3" class="acc"/>
  <text x="72" y="138" class="txt acc">figure</text>
  <text x="150" y="138" class="mono mut" text-anchor="end">b₂</text>

  <rect x="28" y="160" width="140" height="24" rx="4" class="card"/>
  <text x="40" y="176" class="txt fg">paragraph</text>
  <text x="150" y="176" class="mono mut" text-anchor="end">b₃</text>

  <rect x="28" y="192" width="140" height="24" rx="4" class="card"/>
  <text x="40" y="208" class="txt fg">paragraph</text>
  <text x="150" y="208" class="mono mut" text-anchor="end">b₄</text>

  <text x="98" y="248" class="sm mut" text-anchor="middle">ordered block sequence</text>
  <text x="98" y="263" class="sm mut" text-anchor="middle">— the position is right there</text>

  <!-- ── Split ───────────────────────────────────────────────────────────── -->
  <path d="M188 153 C 208 153, 208 96, 226 96"   class="rule" fill="none" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M188 153 C 208 153, 208 306, 226 306" class="accs" fill="none" stroke-width="1.6" marker-end="url(#aa)"/>

  <!-- ── Lane A: conventional ────────────────────────────────────────────── -->
  <text x="238" y="24" class="lbl mut">Conventional ingestion</text>
  <rect x="238" y="34" width="648" height="152" rx="8" class="page"/>

  <text x="256" y="58" class="sm mut">chunks</text>
  <rect x="256" y="66" width="86" height="30" rx="4" class="card"/><text x="299" y="86" class="mono fg" text-anchor="middle">c₁</text>
  <rect x="350" y="66" width="86" height="30" rx="4" class="card"/><text x="393" y="86" class="mono fg" text-anchor="middle">c₂</text>
  <rect x="444" y="66" width="86" height="30" rx="4" class="card"/><text x="487" y="86" class="mono fg" text-anchor="middle">c₃</text>

  <text x="596" y="58" class="sm mut">figures, separately</text>
  <rect x="596" y="66" width="120" height="30" rx="4" class="card"/>
  <rect x="606" y="73" width="18" height="16" rx="2" class="mut"/>
  <text x="676" y="86" class="mono mut" text-anchor="middle">figure</text>

  <!-- the severed relation -->
  <path d="M540 81 L586 81" class="dead" stroke-width="1.6" stroke-dasharray="4 4" fill="none"/>
  <path d="M556 73 L570 89 M570 73 L556 89" class="dead" stroke-width="2"/>
  <text x="563" y="112" class="sm deadf" text-anchor="middle">ordering discarded</text>

  <text x="256" y="140" class="txt fg">Position must now be reconstructed from the caption.</text>
  <text x="256" y="160" class="sm mut">On this corpus 80.7% of figures have no printed caption, so for four figures in</text>
  <text x="256" y="175" class="sm mut">five there is nothing left to reconstruct it from.</text>

  <!-- ── Lane B: anchor-preserving ───────────────────────────────────────── -->
  <text x="238" y="234" class="lbl acc">Anchor-preserving</text>
  <rect x="238" y="244" width="648" height="170" rx="8" class="page accs" stroke-width="1.3"/>

  <text x="256" y="268" class="sm mut">chunks</text>
  <rect x="256" y="276" width="86" height="30" rx="4" class="card"/><text x="299" y="296" class="mono fg" text-anchor="middle">c₁</text>
  <rect x="350" y="276" width="86" height="30" rx="4" class="card accs" stroke-width="1.5"/><text x="393" y="296" class="mono fg" text-anchor="middle">c₂</text>
  <rect x="444" y="276" width="86" height="30" rx="4" class="card"/><text x="487" y="296" class="mono fg" text-anchor="middle">c₃</text>

  <!-- the retained relation -->
  <path d="M393 310 L393 336" class="accs" stroke-width="1.8" fill="none" marker-end="url(#aa)"/>
  <rect x="350" y="340" width="120" height="30" rx="4" class="card accs" stroke-width="1.5"/>
  <rect x="360" y="347" width="18" height="16" rx="2" class="acc"/>
  <text x="428" y="360" class="mono acc" text-anchor="middle">figure</text>
  <text x="486" y="330" class="mono acc">a(f) = 2</text>

  <text x="596" y="268" class="sm mut">stored as</text>
  <rect x="596" y="276" width="270" height="30" rx="4" class="card"/>
  <text x="610" y="296" class="mono fg">{ figure, anchor: 2 }</text>
  <text x="596" y="322" class="sm mut">one integer, written once,</text>
  <text x="596" y="337" class="sm mut">no model involved</text>

  <text x="256" y="394" class="txt fg">Position is a lookup, available for 100% of figures — captioned or not.</text>
</svg>
