<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="IKAT">
  <title>IKAT</title>
  <desc>Four threads of prose with one binding thread woven through them, tying a
        figure into the reading flow.</desc>

  <!-- The prose. Four threads of running text — what conventional ingestion keeps. -->
  <g fill="currentColor" opacity=".34">
    <rect x="5"  y="13" width="53" height="5.5" rx="2.75"/>
    <rect x="5"  y="24" width="53" height="5.5" rx="2.75"/>
    <rect x="5"  y="35" width="53" height="5.5" rx="2.75"/>
    <rect x="5"  y="46" width="33" height="5.5" rx="2.75"/>
  </g>

  <!-- The binding thread. Gaps fall exactly on rows 1 and 3, so it reads as
       passing UNDER them and OVER row 2 — the over/under of a real ikat weave.
       Without the alignment it reads as a dashed line laid on top. -->
  <g fill="#E4572E">
    <rect x="41.5" y="4"  width="6" height="8"  rx="3"/>
    <rect x="41.5" y="19" width="6" height="15" rx="3"/>
    <rect x="41.5" y="41" width="6" height="6"  rx="3"/>
  </g>

  <!-- The figure, tied into the flow where the thread ends. The only closed
       shape in the mark, so the eye lands on it last. -->
  <rect x="37" y="45" width="16" height="14" rx="4" fill="#E4572E"/>
  <circle cx="41.8" cy="49.8" r="1.6" fill="#fff" opacity=".95"/>
  <path d="M38.8 57 L43 51.8 L46 55 L48.3 52.6 L51 57 Z" fill="#fff" opacity=".95"/>
</svg>
