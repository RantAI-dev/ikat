name: ci

# Every scored script needs endpoints, a GPU and a corpus that cannot exist in
# CI, so there is no honest way to run the benchmark here. What CI can check is
# that the code type-checks against Bun's runtime types — which is what caught
# the missing `unpdf` dependency and the six-level path climb the monorepo
# extract left behind.

on:
  push:
    paths-ignore: ["paper/**", "docs/**", "web/**", "**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit
