name: paper

# The manuscript is source, so it gets built like source. A push that breaks the
# LaTeX should fail here, not the night before a deadline.

on:
  push:
    paths: ["paper/**", ".github/workflows/paper.yml"]
  pull_request:
    paths: ["paper/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        working-directory: paper
        run: tectonic -X compile main.tex --print

      - uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: paper/main.pdf
